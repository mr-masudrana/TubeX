# ডিপেন্ডেন্সি স্বয়ংক্রিয় আপডেট: প্রতি সপ্তাহে PR আসবে।
# Kotlin / KSP / Compose কম্পাইলার একসাথে মিলিয়ে চলে, তাই এগুলো নিজে থেকে বাড়ানো হয় না — হাতে একসাথে বাড়ান।
# দ্রষ্টব্য: NewPipeExtractor JitPack থেকে আসে, Dependabot ধরে না — সেটা `app/build.gradle.kts`-এ হাতে দেখুন
# (github.com/TeamNewPipe/NewPipeExtractor/releases)।
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: [ "androidx.*" ]
      media3:
        patterns: [ "androidx.media3:*" ]
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "androidx.compose.compiler*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
